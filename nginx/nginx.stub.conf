# Placeholder baked into the nginx image at build time.
# deploy-pod.sh mounts a rendered nginx.conf (from render-nginx-conf.sh) over this path.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server {
        listen 9443;
        return 444;
    }
}
