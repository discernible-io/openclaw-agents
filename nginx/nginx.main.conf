# TLS sidecar for OpenClaw gateways — primary surfaces:
#   A2A: POST /a2a, GET /.well-known/agent-card.json (RODiT JWT on POST)
#   Webhooks: POST /hooks/wake, POST /hooks/agent, POST /hooks/<name> (hooks.token)
# nginx terminates TLS and reverse-proxies; gateway enforces auth (not nginx).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /etc/nginx/inc/http-common.inc;

    upstream openclaw_agent_a {
        server 127.0.0.1:18789;
    }

    upstream openclaw_agent_b {
        server 127.0.0.1:18791;
    }

    upstream openclaw_agent_c {
        server 127.0.0.1:18793;
    }

    # --- agent-a (primary health check host) ---
    server {
        listen 5443 ssl;
        http2 on;
        server_name agent-a.identyclaw.com;
        ssl_certificate /app/certs/fullchain.pem;
        ssl_certificate_key /app/certs/privkey.pem;
        include /etc/nginx/inc/security-headers-main.inc;

        location @request_error {
            internal;
            default_type text/plain;
            return 400 "request too large\n";
        }

        location = /health {
            limit_req zone=openclaw_health burst=10 nodelay;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location / {
            limit_req zone=openclaw_ingress burst=240 nodelay;
            limit_req zone=openclaw_public burst=120 nodelay;
            include /etc/nginx/inc/openclaw-proxy.inc;
            proxy_pass http://openclaw_agent_a;
        }
    }

    # --- agent-b ---
    server {
        listen 5443 ssl;
        http2 on;
        server_name agent-b.identyclaw.com;
        ssl_certificate /app/certs/fullchain.pem;
        ssl_certificate_key /app/certs/privkey.pem;
        include /etc/nginx/inc/security-headers-main.inc;

        location @request_error {
            internal;
            default_type text/plain;
            return 400 "request too large\n";
        }

        location / {
            limit_req zone=openclaw_ingress burst=240 nodelay;
            limit_req zone=openclaw_public burst=120 nodelay;
            include /etc/nginx/inc/openclaw-proxy.inc;
            proxy_pass http://openclaw_agent_b;
        }
    }

    # --- agent-c ---
    server {
        listen 5443 ssl;
        http2 on;
        server_name agent-c.identyclaw.com;
        ssl_certificate /app/certs/fullchain.pem;
        ssl_certificate_key /app/certs/privkey.pem;
        include /etc/nginx/inc/security-headers-main.inc;

        location @request_error {
            internal;
            default_type text/plain;
            return 400 "request too large\n";
        }

        location / {
            limit_req zone=openclaw_ingress burst=240 nodelay;
            limit_req zone=openclaw_public burst=120 nodelay;
            include /etc/nginx/inc/openclaw-proxy.inc;
            proxy_pass http://openclaw_agent_c;
        }
    }
}
