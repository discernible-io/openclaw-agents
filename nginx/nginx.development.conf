# TLS sidecar for OpenClaw gateways — primary surfaces:
#   A2A: POST /a2a, GET /.well-known/agent-card.json (RODiT JWT on POST)
#   Webhooks: POST /hooks/wake, POST /hooks/agent, POST /hooks/<name> (RODiT x-signature + x-timestamp)
#   Telegram: POST /telegram-webhook (Bot API; public port must be 80, 88, 443, or 8443)
#   Plugin API: POST /api/login, GET /api/login/timestamp (P2P JWT for A2A)
# nginx terminates TLS and reverse-proxies public API paths only; Control UI stays off the public hostname.
#
# Development ingress — per-agent hosts on :8443 (Telegram-compatible; AGENT_*_PUBLIC_HOST aliases rendered at deploy).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /etc/nginx/inc/http-common.inc;

    upstream openclaw_agent_a {
        server 127.0.0.1:18789;
    }

    upstream openclaw_agent_c {
        server 127.0.0.1:18793;
    }

    upstream openclaw_agent_e {
        server 127.0.0.1:18797;
    }

    # agent-a — A2A + webhooks @ agent-a.dev.identyclaw.com:8443
    server {
        listen 8443 ssl;
        http2 on;
        server_name agent-a.dev.identyclaw.com;
        ssl_certificate /app/certs/fullchain.pem;
        ssl_certificate_key /app/certs/privkey.pem;
        include /etc/nginx/inc/security-headers.inc;

        location @request_error {
            internal;
            default_type text/plain;
            return 400 "request too large\n";
        }

        location = /health {
            limit_req zone=openclaw_health burst=10 nodelay;
            default_type text/plain;
            return 200 "healthy\n";
        }

        set $openclaw_upstream openclaw_agent_a;
        include /etc/nginx/inc/openclaw-public-locations.inc;
    }

    # agent-c — A2A + webhooks @ agent-c.dev.identyclaw.com:8443
    server {
        listen 8443 ssl;
        http2 on;
        server_name agent-c.dev.identyclaw.com;
        ssl_certificate /app/certs/fullchain.pem;
        ssl_certificate_key /app/certs/privkey.pem;
        include /etc/nginx/inc/security-headers.inc;

        location @request_error {
            internal;
            default_type text/plain;
            return 400 "request too large\n";
        }

        location = /health {
            limit_req zone=openclaw_health burst=10 nodelay;
            default_type text/plain;
            return 200 "healthy\n";
        }

        set $openclaw_upstream openclaw_agent_c;
        include /etc/nginx/inc/openclaw-public-locations.inc;
    }

    # agent-e — A2A + webhooks @ agent-e.dev.identyclaw.com:8443
    server {
        listen 8443 ssl;
        http2 on;
        server_name agent-e.dev.identyclaw.com;
        ssl_certificate /app/certs/fullchain.pem;
        ssl_certificate_key /app/certs/privkey.pem;
        include /etc/nginx/inc/security-headers.inc;

        location @request_error {
            internal;
            default_type text/plain;
            return 400 "request too large\n";
        }

        location = /health {
            limit_req zone=openclaw_health burst=10 nodelay;
            default_type text/plain;
            return 200 "healthy\n";
        }

        set $openclaw_upstream openclaw_agent_e;
        include /etc/nginx/inc/openclaw-public-locations.inc;
    }
}
